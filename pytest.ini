[pytest]
asyncio_mode = auto
; Tests share one session-scoped app/engine/db-pool (see tests/conftest.py) so
; the event loop backing them must live for the whole session too — a
; function-scoped loop would hand the session-scoped asyncpg pool and worker
; pool a loop that no longer exists by the second test.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
; `slow` is informational only (lets a reader run `pytest -m "not slow"` for a
; quick loop) — nothing here deselects it by default. Criterion 9 is checked
; hardest of all nine, so the restart tests MUST still run in a plain `pytest`
; invocation; a marker that silently skipped them would prove nothing.
markers =
    slow: process-based durability tests (real subprocess kill/restart, seconds not milliseconds)
